# Banco PostgreSQL para desenvolvimento local.
# Uso: docker compose up -d   (lê POSTGRES_PASSWORD do .env da raiz)
services:
  banco:
    image: postgres:18-alpine
    container_name: moria-presente-db
    environment:
      POSTGRES_USER: moria
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: moria
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - dados-banco:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moria -d moria"]
      interval: 3s
      retries: 20

volumes:
  dados-banco:
